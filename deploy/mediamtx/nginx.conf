# Nginx TLS Reverse Proxy for MaidanLive + MediaMTX
# Replace stream.example.in with your production domain and update SSL cert paths.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name stream.example.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stream.example.in;

    ssl_certificate     /etc/letsencrypt/live/stream.example.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.example.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # 1. Main MaidanLive Application & API
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Socket.IO Real-Time Scoring & Live Chat
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # 3. MediaMTX LL-HLS Playback (/hls/<path>/index.m3u8)
    location /hls/ {
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # 4. MediaMTX WebRTC / WHEP Signaling (/webrtc/<path>/whep)
    location /webrtc/ {
        rewrite ^/webrtc/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, If-Match" always;
        add_header Access-Control-Expose-Headers "Location, Link, ETag" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
