# MediaMTX configuration for MaidanLive Dual-Provider Live Streaming
# Tested with MediaMTX v1.9+

logLevel: info
logDestinations: [stdout]

# Global HTTP API (used by MaidanLive backend MEDIAMTX_API_URL for health & active publisher checks)
api: yes
apiAddress: 0.0.0.0:9997

# Webhook authentication against MaidanLive backend (/api/v1/mediamtx/auth)
# MediaMTX sends POST { user, password, ip, action, path, protocol, id, query }
authMethod: http
authHTTPAddress: http://app:3000/api/v1/mediamtx/auth

# Allow public playback (read/playback) without stream keys;
# enforce stream-key webhook validation on RTMP/SRT/WHIP publish.
authHTTPExclude:
  - action: read
  - action: playback
  - action: api
  - action: metrics

# RTMP ingest (OBS Studio, Larix Broadcaster, Prism Live, hardware encoders)
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# Low-Latency HLS (LL-HLS) playback for Safari, Android Chrome, and fallback players
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigin: '*'

# WebRTC / WHEP ultra-low-latency playback
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# Set your public VPS IP or STUN server in production:
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# Path template matching any MaidanLive stream path (e.g., live/<streamSlug>)
paths:
  all_others:
    source: publisher
    sourceOnDemand: no
    # Wait up to 15s for encoder reconnects during 4G network dips
    readTimeout: 15s
    writeTimeout: 15s
    record: no
